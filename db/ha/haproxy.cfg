# Lab 5 (grade 5): the database router. It keeps the old hostname, `postgres`, so no
# service changes its configuration. It asks every node's Patroni REST API which role it
# has and routes:
#   5432 -> the leader (reads and writes)   5433 -> the replicas (read-only, the ETL)
#   7000 -> HAProxy's status page            8008 -> any node's Patroni API (GET /cluster)
global
    maxconn 4000

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold nx 5s
    hold other 5s

defaults
    mode tcp
    # Every node is on the same compose network: a connection that takes more than a second
    # goes to a node that is gone (a crashed leader), so give up and try again quickly.
    timeout connect 1s
    retries 2
    timeout client 30m
    timeout server 30m
    timeout check 1s
    # A stopped node's name does not resolve: start anyway and keep it down until it does.
    default-server init-addr last,libc,none resolvers docker

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 2s

listen primary
    bind *:5432
    option httpchk GET /primary
    http-check expect status 200
    # Checked every second: a node that stops being the leader is out after two checks and
    # its client connections are cut, so the services reconnect to the new leader instead of
    # writing to a replica; the new leader is in after one (only it answers /primary).
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
    server pg-1 pg-1:5432 check port 8008
    server pg-2 pg-2:5432 check port 8008
    server pg-3 pg-3:5432 check port 8008

listen replicas
    bind *:5433
    balance roundrobin
    option redispatch
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg-1 pg-1:5432 check port 8008
    server pg-2 pg-2:5432 check port 8008
    server pg-3 pg-3:5432 check port 8008

listen patroni-api
    mode http
    bind *:8008
    balance first
    option httpchk GET /liveness
    http-check expect status 200
    default-server inter 1s fall 2 rise 1
    server pg-1 pg-1:8008 check
    server pg-2 pg-2:8008 check
    server pg-3 pg-3:8008 check
