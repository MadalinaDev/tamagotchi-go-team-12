# Tamagotchi Go, Team 12: common deployment for Lab 3.
#
# Only published Docker Hub images are used (no `build:`); every image is
# built in its private repository and pushed as <owner>/<image>:<version>.
#
# Usage:
#   cp .env.example .env     # set the passwords, tokens and secrets (letters, digits and underscores)
#   docker compose up -d --wait
#
# Postgres runs the scripts in ./db/init only on an empty volume. To start
# from scratch (drops all data): docker compose down -v
#
# Ports, image names and database names follow docs/lab-1-conventions
# (sections 2-4 and 10); the Lab 2 routing, auth and limits follow
# docs/lab-2-conventions.md. The Gateway (port 8080) is the only REST
# entry point; migrated services use `expose:` instead of `ports:`.
#
# Lab 3 (docs/lab-3-conventions.md): every migrated service runs as two
# replicas that register with service-discovery; the Gateway balances them
# round-robin. Three for the demo:
#   docker compose up -d --scale user-management-service=3

name: tamagotchi-go

x-service: &service
  restart: on-failure
  depends_on:
    postgres:
      condition: service_healthy

x-service-env: &service-env
  DB_HOST: postgres
  DB_PORT: "5432"
  RUN_MIGRATIONS: "true"
  AUTH_MODE: mock

# Lab 3 settings of every service that registers with Service Discovery
# (conventions sections 6 and 11): the merged contract (#56), so /v1/instances
# on port 8089 with `Authorization: Bearer <DISCOVERY_TOKEN>`. DISCOVERY_API
# selects that contract in Guild, Notification, Monster Raid and Package
# Registry; User Management and Map implement only #56 and ignore it.
x-lab3-env: &lab3-env
  DISCOVERY_URL: http://service-discovery:8089
  DISCOVERY_API: v56
  DISCOVERY_TOKEN: ${DISCOVERY_TOKEN:?set DISCOVERY_TOKEN in .env}
  DB_POOL_SIZE: "5"
  LOG_LEVEL: INFO

services:
  postgres:
    # PostGIS is needed only by map-service; the same image serves all DBs.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read by db/init/01-create-databases.sh to create one user per service.
      BATTLE_DB_PASSWORD: ${BATTLE_DB_PASSWORD:?set BATTLE_DB_PASSWORD in .env}
      TAMAGOTCHI_DB_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD:?set TAMAGOTCHI_DB_PASSWORD in .env}
      GUILD_DB_PASSWORD: ${GUILD_DB_PASSWORD:?set GUILD_DB_PASSWORD in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
      USER_MANAGEMENT_DB_PASSWORD: ${USER_MANAGEMENT_DB_PASSWORD:?set USER_MANAGEMENT_DB_PASSWORD in .env}
      MAP_DB_PASSWORD: ${MAP_DB_PASSWORD:?set MAP_DB_PASSWORD in .env}
      RAID_DB_PASSWORD: ${RAID_DB_PASSWORD:?set RAID_DB_PASSWORD in .env}
      REGISTRY_DB_PASSWORD: ${REGISTRY_DB_PASSWORD:?set REGISTRY_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Published so services can also be run locally with DB_HOST=localhost.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    # Replicas multiply the connection pools; each one is capped by DB_POOL_SIZE.
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      # TCP check: during init Postgres listens only on the Unix socket, so
      # this turns healthy only after the init scripts have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  service-discovery:
    # Lab 3: registry of the running replicas (conventions section 5). It polls
    # every replica's GET /status and alerts on Discord or Telegram (section 10).
    image: madalina060504/tamagotchi-service-discovery:0.4.1
    # Published for amd64 only; runs emulated on Apple Silicon.
    platform: linux/amd64
    environment:
      PORT: "8089"
      DISCOVERY_TOKEN: ${DISCOVERY_TOKEN:?set DISCOVERY_TOKEN in .env}
      # Empty = alerts are only logged.
      ALERT_DISCORD_WEBHOOK_URL: ${ALERT_DISCORD_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      LOG_LEVEL: INFO
    ports:
      # Published for the demo: curl http://localhost:8089/v1/services
      # (writes still need the token).
      - "8089:8089"
    restart: unless-stopped

  gateway-service:
    # 0.4.0 (Lab 3): replicas from service-discovery, round-robin, circuit
    # breaker per replica and eviction (gateway-service#10).
    image: madalina060504/tamagotchi-gateway-service:0.4.0
    # Published for amd64 only; runs emulated on Apple Silicon.
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
      service-discovery:
        condition: service_started
    environment:
      PORT: "8080"
      BATTLE_URL: http://battle-service:8081
      TAMAGOTCHI_URL: http://tamagotchi-service:8082
      GUILD_URL: http://guild-service:8083
      NOTIFICATION_URL: http://notification-service:8084
      USER_MANAGEMENT_URL: http://user-management-service:8085
      MAP_URL: http://map-service:8086
      RAID_URL: http://monster-raid-service:8087
      REGISTRY_URL: http://package-registry-service:8088
      GUILD_PUBLIC_WS_URL: ws://localhost:8083
      AUTH_MODE: jwks
      JWKS_URL: http://user-management-service:8085/api/v1/auth/jwks
      JWT_ISSUER: user-management
      JWT_AUDIENCE: tamagotchi-go
      INTERNAL_SERVICE_TOKENS: >-
        battle=${BATTLE_SERVICE_TOKEN:?set BATTLE_SERVICE_TOKEN in .env},
        tamagotchi=${TAMAGOTCHI_SERVICE_TOKEN:?set TAMAGOTCHI_SERVICE_TOKEN in .env},
        guild=${GUILD_SERVICE_TOKEN:?set GUILD_SERVICE_TOKEN in .env},
        notification=${NOTIFICATION_SERVICE_TOKEN:?set NOTIFICATION_SERVICE_TOKEN in .env},
        user-management=${USER_MANAGEMENT_SERVICE_TOKEN:?set USER_MANAGEMENT_SERVICE_TOKEN in .env},
        map=${MAP_SERVICE_TOKEN:?set MAP_SERVICE_TOKEN in .env},
        monster-raid=${RAID_SERVICE_TOKEN:?set RAID_SERVICE_TOKEN in .env},
        package-registry=${REGISTRY_SERVICE_TOKEN:?set REGISTRY_SERVICE_TOKEN in .env}
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      # Interim bridge until User Management emits role claims (seed admin ID).
      GATEWAY_ADMIN_USER_IDS: ${GATEWAY_ADMIN_USER_IDS:-00000000-0000-4000-8000-000000000009}
      TASK_TIMEOUT_MS: "5000"
      MAX_CONCURRENT_TASKS: "50"
      # Lab 3: the *_URL values above stay the fallback for a service without
      # registered replicas. The Gateway registers itself as `gateway`.
      DISCOVERY_URL: http://service-discovery:8089
      DISCOVERY_TOKEN: ${DISCOVERY_TOKEN:?set DISCOVERY_TOKEN in .env}
      DISCOVERY_REFRESH_MS: "2000"
      LOG_LEVEL: INFO
    ports:
      - "8080:8080"

  battle-service:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      gateway-service:
        condition: service_started
    image: ekkusuu/tamagotchi-battle-service:0.4.0
    # Published for amd64 only; runs emulated on Apple Silicon.
    platform: linux/amd64
    # Lab 3: timeouts, expiry and preparation are claimed in the
    # database (FOR UPDATE SKIP LOCKED), so replicas never apply one twice.
    deploy:
      replicas: 2
    environment:
      <<: [*service-env, *lab3-env]
      AUTH_MODE: gateway
      PORT: "8081"
      DB_NAME: battle_db
      DB_USER: battle_user
      DB_PASSWORD: ${BATTLE_DB_PASSWORD}
      STORAGE: postgres
      DB_SSLMODE: disable
      USE_MOCKS: "false"
      SEED_ON_START: "true"
      TASK_TIMEOUT: 5s
      MAX_CONCURRENT_TASKS: "50"
      GATEWAY_URL: http://gateway-service:8080
      GATEWAY_SERVICE_TOKEN: ${BATTLE_SERVICE_TOKEN}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    expose:
      - "8081"

  tamagotchi-service:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      gateway-service:
        condition: service_started
    image: ekkusuu/tamagotchi-tamagotchi-service:0.4.0
    # Published for amd64 only; runs emulated on Apple Silicon.
    platform: linux/amd64
    # Lab 3: reservations and settlement live in the database, so
    # replicas are interchangeable.
    deploy:
      replicas: 2
    environment:
      <<: [*service-env, *lab3-env]
      AUTH_MODE: gateway
      PORT: "8082"
      DB_NAME: tamagotchi_db
      DB_USER: tamagotchi_user
      DB_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD}
      STORAGE: postgres
      DB_SSLMODE: disable
      USE_MOCKS: "false"
      SEED_ON_START: "true"
      TASK_TIMEOUT: 5s
      MAX_CONCURRENT_TASKS: "50"
      GATEWAY_URL: http://gateway-service:8080
      GATEWAY_SERVICE_TOKEN: ${TAMAGOTCHI_SERVICE_TOKEN}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    expose:
      - "8082"

  guild-service:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      gateway-service:
        condition: service_started
    image: nikvnln/tamagotchi-guild-service:0.4.0
    # Lab 3: chat tickets live in the database and chat events reach every
    # replica through Postgres LISTEN/NOTIFY, so any replica can serve a socket.
    deploy:
      replicas: 2
    environment:
      <<: [*service-env, *lab3-env]
      PORT: "8083"
      STORAGE: postgres
      DB_NAME: guild_db
      DB_USER: guild_user
      DB_PASSWORD: ${GUILD_DB_PASSWORD}
      SEED_ON_START: "true"
      # REST is accepted only from the gateway (X-Gateway-Secret).
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      # User Management, Package Registry and Notification through the gateway.
      USE_MOCKS: "false"
      GATEWAY_URL: http://gateway-service:8080
      SERVICE_TOKEN: ${GUILD_SERVICE_TOKEN}
      TASK_TIMEOUT_MS: "5000"
      MAX_CONCURRENT_TASKS: "50"
    # No host port here: replicas cannot share one, and Docker does not say
    # which replica would get which port of a range. `guild-ws` publishes 8083.
    expose:
      - "8083"

  guild-ws:
    # Fixed entry for the chat WebSocket that the gateway hands out
    # (GUILD_PUBLIC_WS_URL=ws://localhost:8083). It forwards every TCP
    # connection to a Guild replica (Docker DNS rotates them), so any replica
    # can take the socket: tickets are in the database and chat events reach
    # every replica through LISTEN/NOTIFY. REST on this port still requires
    # the gateway secret.
    image: alpine/socat:1.8.1.3
    command: ["TCP-LISTEN:8083,fork,reuseaddr", "TCP:guild-service:8083"]
    depends_on:
      guild-service:
        condition: service_healthy
    ports:
      - "8083:8083"
    restart: unless-stopped

  notification-service:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      gateway-service:
        condition: service_started
    image: nikvnln/tamagotchi-notification-service:0.4.0
    # Lab 3: all state is in the database, so replicas are interchangeable.
    deploy:
      replicas: 2
    environment:
      <<: [*service-env, *lab3-env]
      PORT: "8084"
      STORAGE: postgres
      DB_NAME: notification_db
      DB_USER: notification_user
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      SEED_ON_START: "true"
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      # Guild through the gateway.
      USE_MOCKS: "false"
      GATEWAY_URL: http://gateway-service:8080
      SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN}
      TASK_TIMEOUT_MS: "5000"
      MAX_CONCURRENT_TASKS: "50"
    expose:
      - "8084"

  user-management-service:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      gateway-service:
        condition: service_started
    # 0.4.0 (Lab 3, docs/lab-3-contract-madalina.md): registers with
    # service-discovery, GET /status, circuit breaker, JSON logs, and one JWT
    # signing key shared by all replicas through user_management_db.
    # The Gateway reads its JWKS directly from this service; everything else comes through the Gateway.
    image: madalina060504/tamagotchi-user-management-service:0.4.0
    # Published for amd64 only; runs emulated on Apple Silicon.
    platform: linux/amd64
    deploy:
      replicas: 2
    environment:
      <<: [*service-env, *lab3-env]
      AUTH_MODE: gateway
      PORT: "8085"
      DB_NAME: user_management_db
      DB_USER: user_management_user
      DB_PASSWORD: ${USER_MANAGEMENT_DB_PASSWORD}
      USE_MOCKS: "false"
      SEED_ON_START: "true"
      TASK_TIMEOUT_MS: "5000"
      MAX_CONCURRENT_TASKS: "50"
      GATEWAY_URL: http://gateway-service:8080
      GATEWAY_SERVICE_TOKEN: ${USER_MANAGEMENT_SERVICE_TOKEN}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    expose:
      - "8085"

  map-service:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      gateway-service:
        condition: service_started
    # 0.4.0 (Lab 3, docs/lab-3-contract-madalina.md): registers with
    # service-discovery, GET /status, circuit breaker on User Management, JSON
    # logs; SSE stream GET /api/v1/map/stream, task limits.
    image: madalina060504/tamagotchi-map-service:0.4.0
    # Published for amd64 only; runs emulated on Apple Silicon.
    platform: linux/amd64
    deploy:
      replicas: 2
    environment:
      <<: [*service-env, *lab3-env]
      AUTH_MODE: gateway
      PORT: "8086"
      DB_NAME: map_db
      DB_USER: map_user
      DB_PASSWORD: ${MAP_DB_PASSWORD}
      USE_MOCKS: "false"
      SEED_ON_START: "true"
      TASK_TIMEOUT_MS: "5000"
      MAX_CONCURRENT_TASKS: "50"
      MAP_STREAM_INTERVAL_MS: "5000"
      GATEWAY_URL: http://gateway-service:8080
      GATEWAY_SERVICE_TOKEN: ${MAP_SERVICE_TOKEN}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    expose:
      - "8086"

  monster-raid-service:
    <<: *service
    # 0.4.0: /status, JSON logs, Service Discovery, circuit breakers, and live HP
    # across replicas through Postgres NOTIFY (docs/lab-3-contract-sabina.md).
    image: sabinapopescu/tamagotchi-monster-raid-service:0.4.0
    # Published for amd64 only; runs emulated on Apple Silicon.
    platform: linux/amd64
    deploy:
      replicas: 2
    environment:
      <<: [*service-env, *lab3-env]
      PORT: "8087"
      DB_NAME: raid_db
      DB_USER: raid_user
      DB_PASSWORD: ${RAID_DB_PASSWORD}
      # Lab 2 task limits: 504 TASK_TIMEOUT, 503 TOO_MANY_CONCURRENT_TASKS.
      TASK_TIMEOUT_MS: "5000"
      MAX_CONCURRENT_TASKS: "50"
      # Calls to other services go only through the gateway, with SERVICE_TOKEN
      # (mapped to this service's X-Service-Name).
      GATEWAY_URL: http://gateway-service:8080
      SERVICE_TOKEN: ${RAID_SERVICE_TOKEN}
      # Guild, Tamagotchi, Package Registry and User Management are all real.
      USE_MOCKS: "false"
      # Same secret as the gateway: requests without X-Gateway-Secret get 401.
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    # Lab 2: no host port; reachable only through gateway-service.
    expose:
      - "8087"

  package-registry-service:
    <<: *service
    # 0.4.0: /status, JSON logs, Service Discovery, circuit breakers; all state is
    # in Postgres, so replicas are interchangeable (docs/lab-3-contract-sabina.md).
    image: sabinapopescu/tamagotchi-package-registry-service:0.4.0
    # Published for amd64 only; runs emulated on Apple Silicon.
    platform: linux/amd64
    deploy:
      replicas: 2
    environment:
      <<: [*service-env, *lab3-env]
      PORT: "8088"
      DB_NAME: registry_db
      DB_USER: registry_user
      DB_PASSWORD: ${REGISTRY_DB_PASSWORD}
      # Lab 2 task limits: 504 TASK_TIMEOUT, 503 TOO_MANY_CONCURRENT_TASKS.
      TASK_TIMEOUT_MS: "5000"
      MAX_CONCURRENT_TASKS: "50"
      # Calls to other services go only through the gateway, with SERVICE_TOKEN
      # (mapped to this service's X-Service-Name).
      GATEWAY_URL: http://gateway-service:8080
      SERVICE_TOKEN: ${REGISTRY_SERVICE_TOKEN}
      USE_MOCKS: "false"
      # Same secret as the gateway: requests without X-Gateway-Secret get 401.
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      # Fixed-ID seed (PetHub, MoodPets, registrations, Big Slime) when empty.
      SEED_ON_START: "true"
    # Lab 2: no host port; reachable only through gateway-service.
    expose:
      - "8088"

volumes:
  pgdata:
