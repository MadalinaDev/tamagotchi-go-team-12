# Tamagotchi Go, Team 12: common deployment for Lab 3.
#
# Only published Docker Hub images are used (no `build:`); every image is
# built in its private repository and pushed as <owner>/<image>:<version>.
#
# Usage:
#   cp .env.example .env     # set the passwords, tokens and secrets (letters, digits and underscores)
#   docker compose up -d --wait
#
# The databases run on a Patroni cluster (Lab 5): the leader runs the scripts in
# ./db/init once, when the cluster is created. To start from scratch (drops all
# data): docker compose down -v
#
# Ports, image names and database names follow docs/lab-1-conventions
# (sections 2-4 and 10); the Lab 2 routing, auth and limits follow
# docs/lab-2-conventions.md. The Gateway (port 8080) is the only REST
# entry point; migrated services use `expose:` instead of `ports:`.
#
# Lab 3 (docs/lab-3-conventions.md): every migrated service runs as two
# replicas that register with service-discovery; the Gateway balances them
# round-robin. Three for the demo:
#   docker compose up -d --scale user-management-service=3

name: tamagotchi-go

x-service: &service
  restart: on-failure
  depends_on:
    postgres:
      condition: service_healthy

x-service-env: &service-env
  DB_HOST: postgres
  DB_PORT: "5432"
  RUN_MIGRATIONS: "true"
  AUTH_MODE: mock

# Lab 3 settings of every service that registers with Service Discovery
# (conventions sections 6 and 11): the merged contract (#56), so /v1/instances
# on port 8089 with `Authorization: Bearer <DISCOVERY_TOKEN>`. DISCOVERY_API
# selects that contract in Guild, Notification, Monster Raid and Package
# Registry; User Management and Map implement only #56 and ignore it.
x-lab3-env: &lab3-env
  DISCOVERY_URL: http://service-discovery:8089
  DISCOVERY_API: v56
  DISCOVERY_TOKEN: ${DISCOVERY_TOKEN:?set DISCOVERY_TOKEN in .env}
  DB_POOL_SIZE: "5"
  LOG_LEVEL: INFO

# Lab 5 (grades 6-7): the sharded cache the gateway and the broker share. Both place a key
# with the same consistent-hash ring over these names, so the list must be the same for both.
x-cache-env: &cache-env
  CACHE_NODES: cache-1:6379,cache-2:6379,cache-3:6379

services:
  # Lab 5 (grade 5, docs/lab-5-conventions.md section 2): the databases run on a Patroni
  # cluster: pg-1, pg-2 and pg-3 (one leader, two streaming replicas, one of them
  # synchronous). Patroni keeps the leader lock in etcd and promotes a replica within
  # seconds when the leader fails; the old leader rejoins as a replica (pg_rewind).
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - etcd
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd-1=http://etcd:2380
      - --initial-cluster-state=new
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pg-1: &pg-node
    # Postgres 16 + PostGIS + Patroni, built from db/ha in this repository.
    image: madalina060504/tamagotchi-postgres-ha:0.6.0
    # Time for Patroni to stop Postgres cleanly and hand the leader lock to a replica.
    stop_grace_period: 30s
    depends_on:
      etcd:
        condition: service_healthy
    environment: &pg-env
      PATRONI_NAME: pg-1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?set REPLICATION_PASSWORD in .env}
      # Patroni's REST API: reading it is open (HAProxy, Prometheus, GET /cluster); changing
      # the cluster (switchover, restart, configuration) needs this login.
      PATRONI_RESTAPI_USERNAME: patroni
      PATRONI_RESTAPI_PASSWORD: ${PATRONI_API_PASSWORD:?set PATRONI_API_PASSWORD in .env}
      # Read by the bootstrap (db/init/01-create-databases.sh): one user per service,
      # plus the read-only ETL user (grade 4).
      BATTLE_DB_PASSWORD: ${BATTLE_DB_PASSWORD:?set BATTLE_DB_PASSWORD in .env}
      TAMAGOTCHI_DB_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD:?set TAMAGOTCHI_DB_PASSWORD in .env}
      GUILD_DB_PASSWORD: ${GUILD_DB_PASSWORD:?set GUILD_DB_PASSWORD in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
      USER_MANAGEMENT_DB_PASSWORD: ${USER_MANAGEMENT_DB_PASSWORD:?set USER_MANAGEMENT_DB_PASSWORD in .env}
      MAP_DB_PASSWORD: ${MAP_DB_PASSWORD:?set MAP_DB_PASSWORD in .env}
      RAID_DB_PASSWORD: ${RAID_DB_PASSWORD:?set RAID_DB_PASSWORD in .env}
      REGISTRY_DB_PASSWORD: ${REGISTRY_DB_PASSWORD:?set REGISTRY_DB_PASSWORD in .env}
      ETL_DB_PASSWORD: ${ETL_DB_PASSWORD:?set ETL_DB_PASSWORD in .env}
    volumes:
      - pg1-data:/var/lib/postgresql/data
    restart: unless-stopped

  pg-2:
    <<: *pg-node
    environment:
      <<: *pg-env
      PATRONI_NAME: pg-2
    volumes:
      - pg2-data:/var/lib/postgresql/data

  pg-3:
    <<: *pg-node
    environment:
      <<: *pg-env
      PATRONI_NAME: pg-3
    volumes:
      - pg3-data:/var/lib/postgresql/data

  postgres:
    # The database router keeps the old hostname, so every service still connects to
    # postgres:5432 and reaches the current leader; 5433 serves the replicas (read-only).
    # Status page: http://localhost:7000. Cluster: http://localhost:8008/cluster.
    image: haproxy:3.0.5-alpine
    depends_on:
      - pg-1
      - pg-2
      - pg-3
    volumes:
      - ./db/ha/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      # Published so services can also be run locally with DB_HOST=localhost.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
      - "5433:5433"
      - "7000:7000"
      - "8008:8008"
    healthcheck:
      # Healthy once a leader accepts connections, so the services start after the
      # bootstrap created their databases.
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:7000/;csv' | grep -E '^primary,pg-[0-9]+,' | grep -q ',UP,'"]
      interval: 3s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  # Lab 5 (grades 6-7, docs/lab-5-conventions.md section 3): three Redis nodes, sharded by
  # consistent hashing in the gateway and the broker (not Redis Cluster). Pure caches: no
  # persistence, least-recently-used eviction at 64 MB. When a node fails, its keys go to the
  # next node on the ring for 10 s; every other key stays where it is.
  cache-1: &cache-node
    image: redis:7.4.1-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    expose:
      - "6379"
    restart: unless-stopped

  cache-2:
    <<: *cache-node

  cache-3:
    <<: *cache-node

  # Lab 5 (grade 4): the data warehouse, a star schema (schema dw) in a Postgres of its own,
  # loaded by etl-service. Grafana reads it as dw_reader (db/warehouse/01-reader.sh).
  warehouse:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:?set WAREHOUSE_DB_PASSWORD in .env}
      WAREHOUSE_READER_PASSWORD: ${WAREHOUSE_READER_PASSWORD:?set WAREHOUSE_READER_PASSWORD in .env}
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./db/warehouse:/docker-entrypoint-initdb.d:ro
    ports:
      # Published for the demo: psql -h localhost -p 5434 -U warehouse warehouse
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  etl-service:
    # Lab 5 (grade 4): reads every team database from the replicas (postgres:5433, as the
    # read-only etl_reader; the leader only when no replica answers), builds the star schema
    # and loads the warehouse every ETL_INTERVAL_SECONDS. MadalinaDev/etl-service.
    image: madalina060504/tamagotchi-etl-service:0.6.0
    # Published for amd64 only; runs emulated on Apple Silicon.
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
      warehouse:
        condition: service_healthy
    environment:
      PORT: "8091"
      SOURCE_DB_HOST: postgres
      SOURCE_DB_PORT: "5433"
      SOURCE_DB_FALLBACK_PORT: "5432"
      SOURCE_DB_USER: etl_reader
      SOURCE_DB_PASSWORD: ${ETL_DB_PASSWORD:?set ETL_DB_PASSWORD in .env}
      WAREHOUSE_DB_HOST: warehouse
      WAREHOUSE_DB_NAME: warehouse
      WAREHOUSE_DB_USER: warehouse
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:?set WAREHOUSE_DB_PASSWORD in .env}
      ETL_INTERVAL_SECONDS: "60"
      # Operator token: POST /v1/runs and GET /v1/reports. Empty = both disabled.
      ETL_ADMIN_TOKEN: ${ETL_ADMIN_TOKEN:-}
      LOG_LEVEL: INFO
    ports:
      # Published for the demo: GET /v1/runs, /v1/warehouse, /v1/reports, /metrics.
      - "8091:8091"
    restart: unless-stopped

  service-discovery:
    # Lab 3: registry of the running replicas (conventions section 5). It polls
    # every replica's GET /status and alerts on Discord or Telegram (section 10).
    # 0.5.0 (Lab 4): registrations carry grpc_port and topics; GET /metrics
    # exports every replica's load and counters for Prometheus.
    image: madalina060504/tamagotchi-service-discovery:0.5.0
    # Published for amd64 only; runs emulated on Apple Silicon.
    platform: linux/amd64
    environment:
      PORT: "8089"
      DISCOVERY_TOKEN: ${DISCOVERY_TOKEN:?set DISCOVERY_TOKEN in .env}
      # Empty = alerts are only logged.
      ALERT_DISCORD_WEBHOOK_URL: ${ALERT_DISCORD_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      LOG_LEVEL: INFO
    ports:
      # Published for the demo: curl http://localhost:8089/v1/services
      # (writes still need the token).
      - "8089:8089"
    restart: unless-stopped

  message-broker:
    # Lab 4 (docs/lab-4-conventions.md): a queue per service for the gateway's
    # requests, service-to-service calls over HTTP (/internal/...) and gRPC
    # (port 50051), durable topic queues with a dead-letter channel in SQLite
    # (volume broker-data), load-based balancing, a breaker per replica and
    # rerouting. Thread-per-request. MadalinaDev/message-broker.
    # 0.6.0 (Lab 5): coordinates the account-deletion saga (POST /v1/sagas, its state in
    # SQLite, compensations) and caches user lookups between services in the shared cache.
    image: madalina060504/tamagotchi-message-broker:0.6.0
    # Published for amd64 only; runs emulated on Apple Silicon.
    platform: linux/amd64
    depends_on:
      service-discovery:
        condition: service_started
      cache-1:
        condition: service_started
      cache-2:
        condition: service_started
      cache-3:
        condition: service_started
    environment:
      <<: *cache-env
      PORT: "8090"
      GRPC_PORT: "50051"
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      # The tokens services call each other with (they were the gateway's in Lab 2-3).
      INTERNAL_SERVICE_TOKENS: >-
        battle=${BATTLE_SERVICE_TOKEN:?set BATTLE_SERVICE_TOKEN in .env},
        tamagotchi=${TAMAGOTCHI_SERVICE_TOKEN:?set TAMAGOTCHI_SERVICE_TOKEN in .env},
        guild=${GUILD_SERVICE_TOKEN:?set GUILD_SERVICE_TOKEN in .env},
        notification=${NOTIFICATION_SERVICE_TOKEN:?set NOTIFICATION_SERVICE_TOKEN in .env},
        user-management=${USER_MANAGEMENT_SERVICE_TOKEN:?set USER_MANAGEMENT_SERVICE_TOKEN in .env},
        map=${MAP_SERVICE_TOKEN:?set MAP_SERVICE_TOKEN in .env},
        monster-raid=${RAID_SERVICE_TOKEN:?set RAID_SERVICE_TOKEN in .env},
        package-registry=${REGISTRY_SERVICE_TOKEN:?set REGISTRY_SERVICE_TOKEN in .env}
      # Operator token: replay or delete dead letters, publish by hand. Empty = disabled.
      BROKER_ADMIN_TOKEN: ${BROKER_ADMIN_TOKEN:-}
      DISCOVERY_URL: http://service-discovery:8089
      DISCOVERY_TOKEN: ${DISCOVERY_TOKEN:?set DISCOVERY_TOKEN in .env}
      LOG_LEVEL: INFO
    volumes:
      - broker-data:/data
    ports:
      # Published for the demo: GET /v1/topics, /v1/dead-letters, /v1/queues, /metrics.
      - "8090:8090"
      - "50051:50051"
    restart: unless-stopped

  gateway-service:
    # 0.5.0 (Lab 4): every request goes to the broker queue of its service
    # (load balancing and breakers moved to the broker); no /internal routes;
    # GET /metrics; admins download every container's logs from Loki at
    # GET /api/v1/admin/logs.
    # 0.6.0 (Lab 5): caches common GETs and verified tokens in the sharded cache
    # (consistent hashing, GET /api/v1/admin/cache), and starts the account-deletion
    # saga at DELETE /api/v1/users/me.
    image: madalina060504/tamagotchi-gateway-service:0.6.0
    # Published for amd64 only; runs emulated on Apple Silicon.
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
      service-discovery:
        condition: service_started
      message-broker:
        condition: service_healthy
      cache-1:
        condition: service_started
      cache-2:
        condition: service_started
      cache-3:
        condition: service_started
    environment:
      <<: *cache-env
      PORT: "8080"
      BROKER_URL: http://message-broker:8090
      LOKI_URL: http://loki:3100
      GUILD_PUBLIC_WS_URL: ws://localhost:8083
      AUTH_MODE: jwks
      # The JWKS comes through the broker's user-management queue too (rerouted around a
      # frozen replica); the gateway sends X-Gateway-Secret with it.
      JWKS_URL: http://message-broker:8090/v1/queues/user-management/api/v1/auth/jwks
      JWT_ISSUER: user-management
      JWT_AUDIENCE: tamagotchi-go
      GATEWAY_SECRET: ${GATEWAY_SECRET:?set GATEWAY_SECRET in .env}
      # Interim bridge until User Management emits role claims (seed admin ID).
      GATEWAY_ADMIN_USER_IDS: ${GATEWAY_ADMIN_USER_IDS:-00000000-0000-4000-8000-000000000009}
      TASK_TIMEOUT_MS: "5000"
      MAX_CONCURRENT_TASKS: "50"
      # Lab 3: the gateway registers itself as `gateway`.
      DISCOVERY_URL: http://service-discovery:8089
      DISCOVERY_TOKEN: ${DISCOVERY_TOKEN:?set DISCOVERY_TOKEN in .env}
      LOG_LEVEL: INFO
    ports:
      - "8080:8080"

  battle-service:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    # 0.5.0 (Lab 4, docs/lab-4-contract-sava.md): calls User Management,
    # Tamagotchi and Package Registry with gRPC Broker.Call, serves a gRPC
    # ServiceEndpoint on 9081 and publishes battle.finished on the broker.
    # 0.6.0 (Lab 5, docs/lab-5-contract-sava.md): during a database failover it
    # answers 503 DEPENDENCY_UNAVAILABLE + Retry-After instead of 500.
    image: ekkusuu/tamagotchi-battle-service:0.6.0
    # Published for amd64 only; runs emulated on Apple Silicon.
    platform: linux/amd64
    # Lab 3: timeouts, expiry and preparation are claimed in the
    # database (FOR UPDATE SKIP LOCKED), so replicas never apply one twice.
    deploy:
      replicas: 2
    environment:
      <<: [*service-env, *lab3-env]
      AUTH_MODE: gateway
      PORT: "8081"
      DB_NAME: battle_db
      DB_USER: battle_user
      DB_PASSWORD: ${BATTLE_DB_PASSWORD}
      STORAGE: postgres
      DB_SSLMODE: disable
      USE_MOCKS: "false"
      SEED_ON_START: "true"
      TASK_TIMEOUT: 5s
      MAX_CONCURRENT_TASKS: "50"
      # Lab 4: calls to other services are gRPC Broker.Call with this service token
      # (no GATEWAY_URL: the HTTP fallback is not needed).
      BROKER_GRPC_URL: message-broker:50051
      GRPC_PORT: "9081"
      GATEWAY_SERVICE_TOKEN: ${BATTLE_SERVICE_TOKEN}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    expose:
      - "8081"
      - "9081"

  tamagotchi-service:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    # 0.5.0 (Lab 4, docs/lab-4-contract-sava.md): calls Package Registry with
    # gRPC Broker.Call, serves a gRPC ServiceEndpoint on 9082 and subscribes to
    # battle.finished (inbox_events + battle_results).
    # 0.6.0 (Lab 5, docs/lab-5-contract-sava.md): during a database failover it
    # answers 503 DEPENDENCY_UNAVAILABLE + Retry-After instead of 500, and
    # Deliver answers UNAVAILABLE so the broker retries the event.
    image: ekkusuu/tamagotchi-tamagotchi-service:0.6.0
    # Published for amd64 only; runs emulated on Apple Silicon.
    platform: linux/amd64
    # Lab 3: reservations and settlement live in the database, so
    # replicas are interchangeable.
    deploy:
      replicas: 2
    environment:
      <<: [*service-env, *lab3-env]
      AUTH_MODE: gateway
      PORT: "8082"
      DB_NAME: tamagotchi_db
      DB_USER: tamagotchi_user
      DB_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD}
      STORAGE: postgres
      DB_SSLMODE: disable
      USE_MOCKS: "false"
      SEED_ON_START: "true"
      TASK_TIMEOUT: 5s
      MAX_CONCURRENT_TASKS: "50"
      # Lab 4: calls to other services are gRPC Broker.Call with this service token
      # (no GATEWAY_URL: the HTTP fallback is not needed).
      BROKER_GRPC_URL: message-broker:50051
      GRPC_PORT: "9082"
      GATEWAY_SERVICE_TOKEN: ${TAMAGOTCHI_SERVICE_TOKEN}
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    expose:
      - "8082"
      - "9082"

  guild-service:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    # 0.6.0 (Lab 5, docs/lab-5-contract-vica.md): during a database failover it
    # answers 503 DEPENDENCY_UNAVAILABLE + Retry-After instead of 500.
    image: nikvnln/tamagotchi-guild-service:0.6.0
    # Lab 3: chat tickets live in the database and chat events reach every
    # replica through Postgres LISTEN/NOTIFY, so any replica can serve a socket.
    deploy:
      replicas: 2
    environment:
      <<: [*service-env, *lab3-env]
      PORT: "8083"
      STORAGE: postgres
      DB_NAME: guild_db
      DB_USER: guild_user
      DB_PASSWORD: ${GUILD_DB_PASSWORD}
      SEED_ON_START: "true"
      # REST is accepted only from the gateway (X-Gateway-Secret).
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      # User Management, Package Registry and Notification through the gateway.
      USE_MOCKS: "false"
      # Lab 4: calls to other services go through the message broker, same paths and token.
      GATEWAY_URL: http://message-broker:8090
      SERVICE_TOKEN: ${GUILD_SERVICE_TOKEN}
      # Lab 4: calls to other services and topic events go through the broker over gRPC.
      BROKER_GRPC_URL: message-broker:50051
      GRPC_PORT: "9083"
      TASK_TIMEOUT_MS: "5000"
      MAX_CONCURRENT_TASKS: "50"
    # No host port here: replicas cannot share one, and Docker does not say
    # which replica would get which port of a range. `guild-ws` publishes 8083.
    expose:
      - "8083"
      - "9083"

  guild-ws:
    # Fixed entry for the chat WebSocket that the gateway hands out
    # (GUILD_PUBLIC_WS_URL=ws://localhost:8083). It forwards every TCP
    # connection to a Guild replica (Docker DNS rotates them), so any replica
    # can take the socket: tickets are in the database and chat events reach
    # every replica through LISTEN/NOTIFY. REST on this port still requires
    # the gateway secret.
    image: alpine/socat:1.8.1.3
    command: ["TCP-LISTEN:8083,fork,reuseaddr", "TCP:guild-service:8083"]
    depends_on:
      guild-service:
        condition: service_healthy
    ports:
      - "8083:8083"
    restart: unless-stopped

  notification-service:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    # 0.6.0 (Lab 5, docs/lab-5-contract-vica.md): during a database failover it
    # answers 503 DEPENDENCY_UNAVAILABLE + Retry-After instead of 500.
    image: nikvnln/tamagotchi-notification-service:0.6.0
    # Lab 3: all state is in the database, so replicas are interchangeable.
    deploy:
      replicas: 2
    environment:
      <<: [*service-env, *lab3-env]
      PORT: "8084"
      STORAGE: postgres
      DB_NAME: notification_db
      DB_USER: notification_user
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      SEED_ON_START: "true"
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      # Guild through the gateway.
      USE_MOCKS: "false"
      # Lab 4: calls to other services go through the message broker, same paths and token.
      GATEWAY_URL: http://message-broker:8090
      SERVICE_TOKEN: ${NOTIFICATION_SERVICE_TOKEN}
      # Lab 4: calls to other services and topic events go through the broker over gRPC.
      BROKER_GRPC_URL: message-broker:50051
      GRPC_PORT: "9084"
      TASK_TIMEOUT_MS: "5000"
      MAX_CONCURRENT_TASKS: "50"
    expose:
      - "8084"
      - "9084"

  user-management-service:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    # 0.4.0 (Lab 3, docs/lab-3-contract-madalina.md): registers with
    # service-discovery, GET /status, circuit breaker, JSON logs, and one JWT
    # signing key shared by all replicas through user_management_db.
    # The Gateway reads its JWKS directly from this service; everything else comes through the Gateway.
    # 0.5.0 (Lab 4, docs/lab-4-contract-madalina.md): calls Package Registry
    # with gRPC Broker.Call, serves a gRPC ServiceEndpoint on 9085 and publishes
    # its outbox on the broker's topics (user.registered, friend.*, enemy.*).
    # 0.6.0 (Lab 5): account status; deactivate, reactivate and erase, the steps of the
    # account-deletion saga the broker coordinates.
    image: madalina060504/tamagotchi-user-management-service:0.6.0
    # Published for amd64 only; runs emulated on Apple Silicon.
    platform: linux/amd64
    deploy:
      replicas: 2
    environment:
      <<: [*service-env, *lab3-env]
      AUTH_MODE: gateway
      PORT: "8085"
      DB_NAME: user_management_db
      DB_USER: user_management_user
      DB_PASSWORD: ${USER_MANAGEMENT_DB_PASSWORD}
      USE_MOCKS: "false"
      SEED_ON_START: "true"
      TASK_TIMEOUT_MS: "5000"
      MAX_CONCURRENT_TASKS: "50"
      # Lab 4: calls to other services go through the message broker, same paths and token.
      GATEWAY_URL: http://message-broker:8090
      GATEWAY_SERVICE_TOKEN: ${USER_MANAGEMENT_SERVICE_TOKEN}
      BROKER_GRPC_URL: message-broker:50051
      GRPC_PORT: "9085"
      EVENT_PUBLISHER: broker
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    expose:
      - "8085"

  map-service:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    # 0.4.0 (Lab 3, docs/lab-3-contract-madalina.md): registers with
    # service-discovery, GET /status, circuit breaker on User Management, JSON
    # logs; SSE stream GET /api/v1/map/stream, task limits.
    # 0.5.0 (Lab 4, docs/lab-4-contract-madalina.md): calls User Management with
    # gRPC Broker.Call, serves a gRPC ServiceEndpoint on 9086, publishes users.nearby
    # and subscribes to friend.removed and enemy.unmarked.
    # 0.6.0 (Lab 5): hide, unhide and purge, its steps of the account-deletion saga.
    image: madalina060504/tamagotchi-map-service:0.6.0
    # Published for amd64 only; runs emulated on Apple Silicon.
    platform: linux/amd64
    deploy:
      replicas: 2
    environment:
      <<: [*service-env, *lab3-env]
      AUTH_MODE: gateway
      PORT: "8086"
      DB_NAME: map_db
      DB_USER: map_user
      DB_PASSWORD: ${MAP_DB_PASSWORD}
      USE_MOCKS: "false"
      SEED_ON_START: "true"
      TASK_TIMEOUT_MS: "5000"
      MAX_CONCURRENT_TASKS: "50"
      MAP_STREAM_INTERVAL_MS: "5000"
      # Lab 4: calls to other services go through the message broker, same paths and token.
      GATEWAY_URL: http://message-broker:8090
      GATEWAY_SERVICE_TOKEN: ${MAP_SERVICE_TOKEN}
      BROKER_GRPC_URL: message-broker:50051
      GRPC_PORT: "9086"
      EVENT_PUBLISHER: broker
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    expose:
      - "8086"

  monster-raid-service:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    # 0.4.0: /status, JSON logs, Service Discovery, circuit breakers, and live HP
    # across replicas through Postgres NOTIFY (docs/lab-3-contract-sabina.md).
    # 0.5.0 (Lab 4, docs/lab-4-contract-sabina.md): calls Guild, Tamagotchi,
    # Package Registry and User Management with gRPC Broker.Call, serves a gRPC
    # ServiceEndpoint on 9087, creates and cancels raids from the topics
    # raid.activation-requested / raid.cancellation-requested and publishes
    # raid.started / raid.finished.
    # 0.6.0 (Lab 5, docs/lab-5-contract-sabina.md): during a database failover it
    # answers 503 DEPENDENCY_UNAVAILABLE + Retry-After instead of 500 or 504, and
    # its LISTEN connection follows the new leader within 2 s.
    image: sabinapopescu/tamagotchi-monster-raid-service:0.6.0
    # Published for amd64 only; runs emulated on Apple Silicon.
    platform: linux/amd64
    deploy:
      replicas: 2
    environment:
      <<: [*service-env, *lab3-env]
      PORT: "8087"
      DB_NAME: raid_db
      DB_USER: raid_user
      DB_PASSWORD: ${RAID_DB_PASSWORD}
      # Lab 2 task limits: 504 TASK_TIMEOUT, 503 TOO_MANY_CONCURRENT_TASKS.
      TASK_TIMEOUT_MS: "5000"
      MAX_CONCURRENT_TASKS: "50"
      # Lab 4: calls to other services are gRPC Broker.Call with this service token
      # (no GATEWAY_URL: the HTTP fallback is not needed).
      BROKER_GRPC_URL: message-broker:50051
      GRPC_PORT: "9087"
      SERVICE_TOKEN: ${RAID_SERVICE_TOKEN}
      # Guild, Tamagotchi, Package Registry and User Management are all real, and
      # raids come only from the broker's topics (the dev route answers 404).
      USE_MOCKS: "false"
      # Same secret as the gateway: requests without X-Gateway-Secret get 401,
      # and topic deliveries without it are rejected.
      GATEWAY_SECRET: ${GATEWAY_SECRET}
    # Lab 2: no host port; reachable only through the gateway and the broker.
    expose:
      - "8087"
      - "9087"

  package-registry-service:
    <<: *service
    depends_on:
      postgres:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    # 0.4.0: /status, JSON logs, Service Discovery, circuit breakers; all state is
    # in Postgres, so replicas are interchangeable (docs/lab-3-contract-sabina.md).
    # 0.5.0 (Lab 4, docs/lab-4-contract-sabina.md): calls User Management and
    # Guild with gRPC Broker.Call, serves a gRPC ServiceEndpoint on 9088 and
    # publishes raid.activation-requested / raid.cancellation-requested from a
    # transactional outbox.
    # 0.6.0 (Lab 5, docs/lab-5-contract-sabina.md): during a database failover it
    # answers 503 DEPENDENCY_UNAVAILABLE + Retry-After instead of 500 or 504.
    image: sabinapopescu/tamagotchi-package-registry-service:0.6.0
    # Published for amd64 only; runs emulated on Apple Silicon.
    platform: linux/amd64
    deploy:
      replicas: 2
    environment:
      <<: [*service-env, *lab3-env]
      PORT: "8088"
      DB_NAME: registry_db
      DB_USER: registry_user
      DB_PASSWORD: ${REGISTRY_DB_PASSWORD}
      # Lab 2 task limits: 504 TASK_TIMEOUT, 503 TOO_MANY_CONCURRENT_TASKS.
      TASK_TIMEOUT_MS: "5000"
      MAX_CONCURRENT_TASKS: "50"
      # Lab 4: calls to other services are gRPC Broker.Call with this service token
      # (no GATEWAY_URL: the HTTP fallback is not needed).
      BROKER_GRPC_URL: message-broker:50051
      GRPC_PORT: "9088"
      SERVICE_TOKEN: ${REGISTRY_SERVICE_TOKEN}
      USE_MOCKS: "false"
      # Same secret as the gateway: requests without X-Gateway-Secret get 401.
      GATEWAY_SECRET: ${GATEWAY_SECRET}
      # Fixed-ID seed (PetHub, MoodPets, registrations, Big Slime) when empty.
      SEED_ON_START: "true"
    # Lab 2: no host port; reachable only through the gateway and the broker.
    expose:
      - "8088"
      - "9088"

  # Lab 4, grade 10: Prometheus scrapes the broker, the gateway and Service
  # Discovery (which exports every replica's load from its /status polls);
  # Alloy ships every container's stdout to Loki; Grafana shows both.
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.5.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-tamagotchi-go}
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      # Where Alloy remembers how far it read each container's logs, so a
      # recreated Alloy does not send them all again.
      - alloy-data:/var/lib/alloy/data
      # Reads the containers' logs through the Docker API (Docker Desktop too).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Lab 5: the Warehouse data source logs in as the read-only dw_reader.
      WAREHOUSE_READER_PASSWORD: ${WAREHOUSE_READER_PASSWORD:?set WAREHOUSE_READER_PASSWORD in .env}
      # The demo dashboard is readable without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tamagotchi-go.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - warehouse
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  # Lab 5: pgdata (the single Postgres of Labs 1-4) is no longer used.
  etcd-data:
  pg1-data:
  pg2-data:
  pg3-data:
  warehouse-data:
  broker-data:
  alloy-data:
