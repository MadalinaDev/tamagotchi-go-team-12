# Lab 4, grade 10. Service Discovery exports every replica of every service (load,
# in-flight tasks, request counters, health) from its /status polls, so the
# services themselves need no metrics endpoint; the broker and the gateway export
# their own queues, breakers, reroutes, deliveries and latencies.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: message-broker
    static_configs:
      - targets: ["message-broker:8090"]
  - job_name: gateway
    static_configs:
      - targets: ["gateway-service:8080"]
  - job_name: service-discovery
    static_configs:
      - targets: ["service-discovery:8089"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
