# Lab 4, grade 10. Service Discovery exports every replica of every service (load,
# in-flight tasks, request counters, health) from its /status polls, so the
# services themselves need no metrics endpoint; the broker and the gateway export
# their own queues, breakers, reroutes, deliveries and latencies.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: message-broker
    static_configs:
      - targets: ["message-broker:8090"]
  - job_name: gateway
    static_configs:
      - targets: ["gateway-service:8080"]
  - job_name: service-discovery
    static_configs:
      - targets: ["service-discovery:8089"]
  # Lab 5: the ETL service (runs, rows per warehouse table, extract errors) and every
  # Patroni node (role, timeline, WAL positions, so the replication lag).
  - job_name: etl
    static_configs:
      - targets: ["etl-service:8091"]
  - job_name: patroni
    static_configs:
      - targets: ["pg-1:8008", "pg-2:8008", "pg-3:8008"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
